{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
    <div class="d-md-flex flex-md-equal w-100 my-md-3 ps-md-3">
        <div class="text-bg-dark me-md-3 pt-3 px-3 pt-md-5 px-md-5 text-center overflow-hidden">
            <div class="my-3 py-3">
                <h2 class="display-5">{{ product.name|default:"Ещё один заголовок" }}</h2>
                <p class="lead">{{ product.description|default:"И ещё более остроумный подзаголовок" }}</p>
            </div>
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}" style="width: 50%; height: 200px; object-fit: cover; border-radius: 21px 21px 0 0;">
            {% else %}
                <div class="bg-body-tertiary shadow-sm mx-auto d-flex align-items-center justify-content-center" style="width: 80%; height: 300px; border-radius: 21px 21px 0 0;">
                    <span class="text-muted">Нет изображения</span>
                </div>
            {% endif %}
        </div>
    </div>
{% endblock %}
