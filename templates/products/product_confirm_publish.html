{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Изменение статуса публикации</h1>
    <p>Вы уверены, что хотите {% if product.is_published %}снять с публикации{% else %}опубликовать{% endif %} продукт "{{ product.name }}"?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Да, подтвердить</button>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
