{% extends 'products/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-6">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}" style="width: 100%; object-fit: cover;">
            {% else %}
                <div class="bg-secondary d-flex align-items-center justify-content-center rounded" style="height: 400px;">
                    <span class="text-white">Нет изображения</span>
                </div>
            {% endif %}
        </div>
        <div class="col-md-6">
            <h1 class="display-5">{{ object.name }}</h1>
            <p class="lead">{{ object.description }}</p>
            <p class="h3 text-primary">{{ object.price }} ₽</p>
            <p class="text-muted">Категория: {{object.category }}</p>

            <div class="d-flex gap-3 mt-4">
                <button class="btn btn-primary btn-lg">Добавить в корзину</button>
                <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary btn-lg">Назад</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
