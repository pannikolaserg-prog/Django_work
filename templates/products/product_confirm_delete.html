<!DOCTYPE html>
<html>
<head>
    <title>Удалить товар</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        button { background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #c82333; }
        .cancel { background: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; margin-left: 10px; }
        .cancel:hover { background: #5a6268; }
    </style>
</head>
<body>
    <h1>Удалить товар</h1>
    <p>Вы уверены, что хотите удалить товар <strong>"{{ product.name }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'catalog:product_list' %}" class="cancel">Отмена</a>
    </form>
</body>
</html>
