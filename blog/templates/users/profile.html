<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .form-control-file { padding: 8px 0; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .avatar { max-width: 150px; margin-bottom: 15px; }
        .logout { background: #dc3545; margin-left: 10px; }
        .messages { margin-bottom: 20px; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="success">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% if user.avatar %}
        <div>
            <img src="{{ user.avatar.url }}" alt="Avatar" class="avatar">
        </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}

            <button type="submit">Сохранить</button>
            <a href="{% url 'users:logout' %}"><button type="button" class="logout">Выйти</button></a>
        </form>

        <p style="margin-top: 20px;"><a href="{% url 'catalog:product_list' %}">На главную</a></p>
    </div>
</body>
</html>
