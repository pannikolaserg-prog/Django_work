{% extends 'products/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h2>Подтверждение удаления</h2>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить запись <strong>"{{ object.name }}"</strong>?</p>
                    <p class="text-danger">Это действие невозможно отменить!</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                            <a href="{% url 'blog:blog_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
